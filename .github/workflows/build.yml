name: build

# Continuous build of the portable (PyInstaller) folder per OS and the Android
# APKs, so a broken push is caught early. Downloadable releases with stable
# file names are published by release.yml.

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch: {}

jobs:
  desktop:
    name: GrabBox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp

      - name: Build (one-folder)
        run: pyinstaller packaging/grabbox.spec --noconfirm

      - uses: actions/upload-artifact@v7
        with:
          name: GrabBox-${{ matrix.os }}
          path: dist/GrabBox

  android:
    name: GrabBox Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      # Native app (Jetpack Compose + bundled yt-dlp engine). One APK per ABI
      # keeps each download small; pick arm64-v8a unless the phone is very old.
      # Debug build on purpose: it ships pre-signed with the debug key so it
      # installs with zero friction until release signing is wired up.
      #
      # The log is captured and re-emitted as workflow annotations: the raw
      # step log is truncated in the web UI and needs a signed-in session, so
      # a failing build would otherwise be unreadable from a PR comment.
      - name: Build APKs (per-ABI)
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace > /tmp/gradle.log 2>&1 || status=$?
          status=${status:-0}
          tail -c 40000 /tmp/gradle.log >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### `gradle assembleDebug` exited $status"
            echo '```'
            grep -nE "^e: |error:|FAILURE:|What went wrong|Caused by:|^\* Try:|AAPT|Execution failed|Unresolved reference|Cannot find|Unsupported|expected" \
              /tmp/gradle.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|FAILURE:|What went wrong|Caused by:|^\* Try:|AAPT|Execution failed|Unresolved reference|Cannot find|Unsupported|expected" \
            /tmp/gradle.log | head -25 \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | while IFS= read -r line; do
                echo "::error title=Android build::${line}"
              done
          exit $status

      # The whole Android app depends on this one property: youtubedl-android
      # reads libpython.zip.so out of nativeLibraryDir, and PackageManager
      # only populates that directory by *extracting* the .so files from the
      # APK. If the entries are stored uncompressed the OS maps them straight
      # out of the archive and the directory stays empty, which is exactly
      # how "failed to initialize" happened. Assert it instead of assuming it.
      - name: Verify the engine payload is extractable
        working-directory: android
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no APK produced"; exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "--- $(basename "$apk")"
            python3 - "$apk" <<'PY'
          import os, sys, zipfile
          apk = sys.argv[1]
          wanted = ("libpython.zip.so", "libpython.so", "libffmpeg.so")
          z = zipfile.ZipFile(apk)
          found, stored, missing = set(), [], []
          for name in z.namelist():
              base = os.path.basename(name)
              if base in wanted and base not in found:
                  found.add(base)
                  info = z.getinfo(name)
                  method = "deflated" if info.compress_type == zipfile.ZIP_DEFLATED else "STORED"
                  print("    %-22s %-8s %8d bytes  %s" % (base, method, info.file_size, name))
                  if info.compress_type == zipfile.ZIP_STORED:
                      stored.append(base)
          missing = [w for w in wanted if w not in found]
          for m in missing:
              print("    %-22s MISSING" % m)
          if missing:
              print("::error::engine payload missing from %s: %s" % (apk, ", ".join(missing)))
          if stored:
              print("::error::%s stores these uncompressed, so PackageManager "
                    "will NOT extract them and nativeLibraryDir stays empty: %s"
                    % (apk, ", ".join(stored)))
          sys.exit(1 if (missing or stored) else 0)
          PY
          done
          echo "all APKs carry a compressed, extractable engine"

      - uses: actions/upload-artifact@v7
        with:
          name: GrabBox-Android
          path: android/app/build/outputs/apk/**/*.apk

