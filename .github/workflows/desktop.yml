name: desktop (Tauri)

# Continuous build of the GrabBox desktop app (Tauri v2) for Windows, macOS
# (Intel + Apple Silicon) and Linux, with the yt-dlp / ffmpeg / deno sidecars
# bundled. This is the "does it still compile?" check on every push; the
# installers people actually download come from release.yml, which publishes
# them to GitHub Releases under stable names.

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch: {}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GrabBox (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            label: Windows
          - os: macos-latest
            triple: aarch64-apple-darwin
            label: macOS-AppleSilicon
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            label: macOS-Intel
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            label: Linux

    steps:
      - uses: actions/checkout@v6

      - name: Stage browser extension as a bundle resource
        run: |
          mkdir -p desktop/src-tauri/extension
          cp -r extension/* desktop/src-tauri/extension/
        shell: bash

      - name: Fetch sidecar binaries (yt-dlp, ffmpeg, deno)
        run: bash desktop/fetch-sidecars.sh --target ${{ matrix.triple }}
        shell: bash

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Restore Rust cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: tauri-${{ matrix.triple }}-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      - name: Build the app + installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          releaseId: ""
        id: tauri

      - name: Save Rust cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: tauri-${{ matrix.triple }}-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}

      # Installers only. The raw .app folder is what the .dmg already contains;
      # uploading both doubled the macOS artifact to ~300 MB.
      - uses: actions/upload-artifact@v7
        with:
          name: GrabBox-desktop-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
