name: build

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch: {}

jobs:
  desktop:
    name: GrabBox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp

      - name: Build (one-folder)
        run: pyinstaller packaging/grabbox.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: GrabBox-${{ matrix.os }}
          path: dist/GrabBox

  android:
    name: GrabBox APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android/apk
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GrabBox-APK
          path: android/apk/app/build/outputs/apk/debug/app-debug.apk

