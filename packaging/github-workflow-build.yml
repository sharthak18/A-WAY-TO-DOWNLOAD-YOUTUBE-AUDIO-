name: build

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch: {}

jobs:
  desktop:
    name: GrabBox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp

      - name: Build (one-folder)
        run: pyinstaller packaging/grabbox.spec --noconfirm

      - uses: actions/upload-artifact@v7
        with:
          name: GrabBox-${{ matrix.os }}
          path: dist/GrabBox

  android:
    name: GrabBox Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      # Native app (Jetpack Compose + bundled yt-dlp engine). One APK per ABI
      # keeps each download small; pick arm64-v8a unless the phone is very old.
      # Debug build on purpose: it ships pre-signed with the debug key so it
      # installs with zero friction until release signing is wired up.
      - name: Build APKs (per-ABI)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: GrabBox-Android
          path: android/app/build/outputs/apk/**/*.apk

# NOTE: this file is a TEMPLATE. To enable CI builds, copy it to
#   .github/workflows/build.yml
# in your own clone (GitHub blocks bots from adding workflow files directly).
