name: desktop (Tauri)

# Builds the GrabBox desktop app (Tauri v2) for Windows, macOS (Intel + Apple
# Silicon) and Linux, with the yt-dlp / ffmpeg / deno sidecars bundled.
# On a `v*` tag it also drafts a GitHub Release with the installers attached.

on:
  push:
    branches: [main, "arena/*"]
  workflow_dispatch: {}
  release:
    types: [published]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: GrabBox (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: macos-13
            triple: x86_64-apple-darwin
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Stage browser extension as a bundle resource
        run: |
          mkdir -p desktop/src-tauri/extension
          cp -r extension/* desktop/src-tauri/extension/
        shell: bash

      - name: Fetch sidecar binaries (yt-dlp, ffmpeg, deno)
        run: bash desktop/fetch-sidecars.sh --target ${{ matrix.triple }}
        shell: bash

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: tauri-${{ matrix.triple }}-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          save-always: true

      - name: Build the app + installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          # Only tag pushes produce a release; branch pushes just build.
          releaseId: ""
        id: tauri

      - uses: actions/upload-artifact@v4
        with:
          name: GrabBox-desktop-${{ matrix.triple }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app*
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

# NOTE: this file is a TEMPLATE (same reason as the PyInstaller one — GitHub
# blocks bots from adding workflow files). To enable CI builds, copy it to
#   .github/workflows/desktop.yml
# in your own clone, then push. Installers appear under Actions artifacts on
# every push, and under Releases when you tag a version.
